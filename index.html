<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着せ替えスロット</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>着せ替えスロット</h2>

<input type="file" id="upload" accept="image/*" capture="environment">

<div class="main">

  <!-- 左コントロール -->
  <div class="side-control">

    <h4>TOP</h4>

    <div class="adjust-row">
      <button onclick="move('top','x',-2)">◁</button>
      <span>X</span>
      <button onclick="move('top','x',2)">▷</button>
    </div>

    <div class="adjust-row">
      <button onclick="move('top','y',-2)">▲</button>
      <span>Y</span>
      <button onclick="move('top','y',2)">▼</button>
    </div>

    <div class="adjust-row">
      <button onclick="move('top','scale',-0.02)">－</button>
      <span>サイズ</span>
      <button onclick="move('top','scale',0.02)">＋</button>
    </div>

    <h4>BOTTOM</h4>

    <div class="adjust-row">
      <button onclick="move('bottom','x',-2)">◁</button>
      <span>X</span>
      <button onclick="move('bottom','x',2)">▷</button>
    </div>

    <div class="adjust-row">
      <button onclick="move('bottom','y',-2)">▲</button>
      <span>Y</span>
      <button onclick="move('bottom','y',2)">▼</button>
    </div>

    <div class="adjust-row">
      <button onclick="move('bottom','scale',-0.02)">－</button>
      <span>サイズ</span>
      <button onclick="move('bottom','scale',0.02)">＋</button>
    </div>

  </div>

  <!-- 画像 -->
  <div id="canvas-area">
    <img id="base">
    <img id="bottom">
    <img id="top">
  </div>

</div>

<!-- ボタン -->
<div class="controls">
  <button class="reset" onclick="reset()">↻</button>
  <button class="decide" onclick="decide()">決定</button>
  <button onclick="toggleLayer()">前後</button>
</div>

<script src="script.js"></script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
