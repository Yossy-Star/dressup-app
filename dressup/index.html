<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着せ替えスロット</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>着せ替えスロット</h2>

<!-- 初回画像選択 -->
<input type="file" id="upload" accept="image/*" capture="environment">

<div id="canvas-area">
  <img id="base" src="">
  <img id="bottom">
  <img id="top">
</div>

<div class="controls">
  <button onclick="decide()">決定</button>
  <button onclick="reset()">もう一回</button>
  <button onclick="toggleLayer()">前後切替</button>
  <button onclick="resetImage()">画像変更</button>
</div>

<script src="script.js"></script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
